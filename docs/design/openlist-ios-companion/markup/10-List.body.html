<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:930}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { k8: true }, open: false };
  }
  renderVals() {
    var self = this;
    var ids = ['k1', 'k7', 'k8', 'k9', 'k2', 'k3', 'k4', 'k5'];
    var late = { k3: true };
    var c = {}, tc = {}, tg = {}, open = 0;
    ids.forEach(function (id) {
      var d = !!self.state.done[id];
      if (!d) open++;
      c[id] = d ? 'cb done' : (late[id] ? 'cb late' : 'cb');
      tc[id] = d ? 'tt done' : 'tt';
      tg[id] = function () {
        var next = Object.assign({}, self.state.done);
        next[id] = !next[id];
        self.setState({ done: next });
      };
    });
    var o = this.state.open;
    return {
      theme: this.props.theme ?? 'light',
      c: c, tc: tc, tg: tg,
      openCount: open,
      showCompleted: o,
      expanded: o ? 'true' : 'false',
      chev: o ? 90 : 0,
      toggleCompleted: function () { self.setState({ open: !self.state.open }); }
    };
  }
}
</script>
