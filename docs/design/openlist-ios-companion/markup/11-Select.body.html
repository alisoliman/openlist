<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: { k1: true, k3: true, k5: true } };
  }
  renderVals() {
    var self = this;
    var data = [
      ['k1', 'Renew passports', 'Sat', 'tr due'],
      ['k7', 'Book the ryokan', '', 'tr'],
      ['k9', 'Email Kasuga about the tatami room', '', 'tr'],
      ['k2', 'Pay the ryokan deposit', '18:00', 'tr due'],
      ['k3', 'Reserve the Nishiki market tour', '2d late', 'tr late'],
      ['k4', 'Ask Mika to water the planters', 'Today', 'tr due'],
      ['k5', 'Pick up JR passes at Kyoto Station', 'Sun', 'tr']
    ];
    var n = 0;
    var rows = data.map(function (d) {
      var on = !!self.state.sel[d[0]];
      if (on) n++;
      return {
        text: d[1], tr: d[2], trCls: d[3],
        cb: on ? 'cb sel' : 'cb',
        bg: on ? 'var(--accent-soft)' : 'transparent',
        pressed: on ? 'true' : 'false',
        pick: function () {
          var next = Object.assign({}, self.state.sel);
          next[d[0]] = !next[d[0]];
          self.setState({ sel: next });
        }
      };
    });
    return {
      theme: this.props.theme ?? 'light',
      rows: rows,
      count: n,
      selectAll: function () {
        var all = {};
        data.forEach(function (d) { all[d[0]] = true; });
        self.setState({ sel: all });
      }
    };
  }
}
</script>
