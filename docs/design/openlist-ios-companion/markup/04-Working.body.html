<body>
<div id="dc-root"><div class="sc-host" data-sc-name="Working"><div class="ol" data-theme="light" style="width: 390px; height: 844px;"><div class="scroll nodock" style="height: 844px;">
  <div class="topbar">
    <a class="ib bare" href="Main.dc.html" aria-label="Close"><svg class="i s22" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></a>
    <a class="ib bare" href="TaskDetail.dc.html" aria-label="Task details"><svg class="i s22" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20a.5.5 0 0 1-.5.5h-11A.5.5 0 0 1 6 20z"></path><path d="M9 12h6M9 16h4"></path></svg></a>
  </div>

  <div style="flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 24px;">
    <span class="due" style="display: inline-flex; align-items: center; gap: 8px; font-size: 15px; line-height: 20px; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 999px; background: var(--success);"></span><span class="sc-interp">Working</span></span>
    <h1 class="vt" style="margin-top: 8px;">Draft Q3 OKRs</h1>
    <span class="lbl" style="margin-top: 4px;">💼 Q3 planning</span>

    <div style="margin-top: 48px; display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 52px; line-height: 56px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">50</span>
      <span style="font-size: 15px; line-height: 20px; font-weight: 600; color: var(--muted);">min left</span>
    </div>
    <div class="prog" style="width: 220px; margin-top: 14px;"><span style="width: 44%;"></span></div>
    <span class="mono" style="margin-top: 10px; color: var(--muted);">10:00–11:30</span>

    <div style="margin-top: 48px; display: flex; align-items: center; gap: 24px;">
      <a class="ib lg" href="Main.dc.html" aria-label="Stop"><svg class="i s22" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
      <button class="ib xl accent" aria-label="Pause" style="box-shadow: var(--shadow-fab);">
        
        <svg class="i" viewBox="0 0 24 24" style="width: 28px; height: 28px; stroke-width: 2.4;"><path d="M9 5.5v13M15 5.5v13"></path></svg>
      </button>
      <a class="ib lg" href="Main.dc.html" aria-label="Mark done" style="background: var(--success); color: rgb(255, 255, 255);"><svg class="i s24" viewBox="0 0 24 24" style="stroke-width: 2.2;"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></a>
    </div>
  </div>

  <a class="card" href="TaskDetail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px;">
    <span class="lbl" style="font-weight: 600;">Next</span>
    <span class="tt" style="font-size: 15px;">Write interview feedback for Priya</span>
    <span class="tr due">11:30</span>
  </a></div></div></div></div>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paused: false };
  }
  renderVals() {
    var self = this;
    var p = this.state.paused;
    return {
      theme: this.props.theme ?? 'light',
      paused: p,
      running: !p,
      stateLabel: p ? 'Paused' : 'Working',
      pauseLabel: p ? 'Resume' : 'Pause',
      dotColor: p ? 'var(--today)' : 'var(--success)',
      togglePause: function () { self.setState({ paused: !self.state.paused }); }
    };
  }
}
</script>


</body></html>
