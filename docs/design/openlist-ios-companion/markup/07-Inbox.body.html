<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: {} };
  }
  renderVals() {
    var self = this;
    var data = [
      ['i6', 'Send Jun the photos from Nara', '2h'],
      ['i5', 'Cancel the gym trial before it renews', '5h'],
      ['i1', 'Call the dentist back about the crown', '1d'],
      ['i2', 'Look into a standing desk for the study', '2d'],
      ['i3', 'Return the library books', '3d'],
      ['i4', 'Gift ideas for Mika’s birthday', '4d']
    ];
    var left = 0;
    var items = data.map(function (d) {
      var done = !!self.state.done[d[0]];
      if (!done) left++;
      return {
        text: d[1], age: d[2],
        cb: done ? 'cb done' : 'cb',
        tt: done ? 'tt done' : 'tt',
        aria: (done ? 'Reopen ' : 'Complete ') + d[1],
        toggle: function () {
          var next = Object.assign({}, self.state.done);
          next[d[0]] = !next[d[0]];
          self.setState({ done: next });
        }
      };
    });
    return { theme: this.props.theme ?? 'light', items: items, left: left };
  }
}
</script>
