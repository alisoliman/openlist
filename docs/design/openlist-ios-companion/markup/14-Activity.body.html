<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:950}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: '11-2' };
  }
  renderVals() {
    var self = this;
    var seed = [0,1,0,2,1,0,0, 1,0,3,1,0,2,0, 0,2,1,0,4,1,0, 1,1,0,2,0,0,1, 0,3,2,1,0,1,0, 2,0,1,0,5,1,0, 0,1,2,0,1,0,3, 1,0,0,2,1,4,0, 0,2,1,3,0,1,0, 1,0,2,1,0,0,2, 0,1,3,0,1,2,1, 1,2,2,0,0,0,0];
    var names = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    var total = 0, weeks = [], sel = this.state.sel, selCount = 0;
    for (var w = 0; w < 12; w++) {
      var days = [];
      for (var d = 0; d < 7; d++) {
        var n = seed[w * 7 + d];
        var future = w === 11 && d > 2;
        if (!future) total += n;
        var key = w + '-' + d;
        var bg = 'var(--sunken)';
        if (future) bg = 'transparent';
        else if (n >= 7) bg = 'var(--accent)';
        else if (n >= 4) bg = 'rgba(122,79,240,0.65)';
        else if (n >= 2) bg = 'rgba(122,79,240,0.4)';
        else if (n === 1) bg = 'rgba(122,79,240,0.2)';
        var ring = 'none';
        if (key === sel) ring = '0 0 0 2px var(--ink)';
        else if (key === '11-2') ring = '0 0 0 2px var(--accent-text)';
        if (key === sel) selCount = n;
        days.push({
          bg: bg, ring: ring,
          aria: names[d] + ', ' + (future ? 'upcoming' : n + ' done'),
          pick: (function (k, f) { return function () { if (!f) self.setState({ sel: k }); }; })(key, future)
        });
      }
      weeks.push({ days: days });
    }
    var parts = sel.split('-');
    var daysAgo = (11 - +parts[0]) * 7 + (2 - +parts[1]);
    var date = new Date(2026, 8, 23 - daysAgo);
    var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var title = sel === '11-2' ? 'Today' : names[(date.getDay() + 6) % 7] + ' ' + date.getDate() + ' ' + months[date.getMonth()];
    return {
      theme: this.props.theme ?? 'light',
      weeks: weeks,
      total: total,
      dayTitle: title,
      dayCount: selCount,
      isToday: sel === '11-2'
    };
  }
}
</script>
