class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { withDone: false };
  }
  renderVals() {
    var self = this;
    var w = this.state.withDone;
    return {
      theme: this.props.theme ?? 'light',
      withDone: w,
      count: w ? 5 : 4,
      doneCls: w ? 'chip sm on' : 'chip sm',
      donePressed: w ? 'true' : 'false',
      toggleDone: function () { self.setState({ withDone: !self.state.withDone }); }
    };
  }
}
