name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest
      - name: Toolchain
        run: |
          xcodebuild -version
          [[ $(xcodebuild -version | head -n 1) == "Xcode 27."* ]]
          swift --version
          uname -m
      - name: Regression checks
        run: ./Tools/check.sh
      - name: Build and verify Apple Silicon app and widget
        run: ./Tools/build-release.sh 0.1.0 "$GITHUB_RUN_NUMBER"
      - name: Build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: build/release/build.log
  ios:
    runs-on: xcode-27
    # The UI suite alone now runs past 40 minutes on the hosted runners.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest
      - name: Toolchain
        run: |
          xcodebuild -version
          [[ $(xcodebuild -version | head -n 1) == "Xcode 27."* ]]
          xcrun simctl list runtimes
      - name: iOS 27 simulator runtime
        run: xcrun simctl list runtimes | grep -q 'iOS-27-0' || xcodebuild -downloadPlatform iOS
      - name: iOS build, unit and UI tests
        run: ./Tools/run-ios-checks.sh
      - name: iOS logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-logs
          path: |
            build/ios/build.log
            build/ios/test.log
            build/ios/Tests.xcresult
