name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run. Each merge to main
  # gets a finished run instead: the next one waits for it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    # What the change needs (Tools/ci-scope.py), decided on a Linux runner,
    # which takes none of the account's five macOS ones: documentation needs
    # nothing, a Mac change no ios jobs, an iOS change only the check suites
    # that compile iOS files, a test change only its iOS part, and check only
    # the suites that name a changed file. A manual run runs everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      check: ${{ steps.scope.outputs.check }}
      suites: ${{ steps.scope.outputs.suites }}
      release: ${{ steps.scope.outputs.release }}
      ios: ${{ steps.scope.outputs.ios }}
      parts: ${{ steps.scope.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        run: python3 Tools/ci-scope.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  check:
    needs: scope
    if: needs.scope.outputs.check != 'none'
    runs-on: xcode-27
    # 19 to 28 minutes: the regression checks, then the release build.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest
      - name: Toolchain
        run: |
          xcodebuild -version
          [[ $(xcodebuild -version | head -n 1) == "Xcode 27."* ]]
          swift --version
          uname -m
          echo "$(sysctl -n hw.ncpu) cores, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
      - name: Swift packages
        if: needs.scope.outputs.check == 'full'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('Package.resolved', 'openlist.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Regression checks
        # The suites the scope chose; every suite when it chose none.
        run: |
          # shellcheck disable=SC2086 # one suite name per word
          ./Tools/check.sh $SUITES
        env:
          SUITES: ${{ needs.scope.outputs.suites }}
      - name: Build and verify Apple Silicon app and widget
        if: needs.scope.outputs.release == 'true'
        run: ./Tools/build-release.sh 0.1.0 "$GITHUB_RUN_NUMBER"
      - name: Build log
        if: always() && needs.scope.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log
          path: build/release/build.log
  ios:
    # The unit and UI tests in three parts, each on its own runner and
    # simulator, about a third of the UI suite's time each.
    name: ios (${{ matrix.part }}/3)
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.scope.outputs.parts) }}
    # 23 to 38 minutes: the build, the simulator's boot, then a part of the
    # tests. Room for a slow runner and a test's second run, while a hung
    # test still ends well before the old single job's 75.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest
      - name: Toolchain
        run: |
          xcodebuild -version
          [[ $(xcodebuild -version | head -n 1) == "Xcode 27."* ]]
          xcrun simctl list runtimes
          echo "$(sysctl -n hw.ncpu) cores, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          ls /Library/Developer/CoreSimulator/Caches/dyld 2>/dev/null || echo "No simulator dyld caches yet"
      - name: iOS 27 simulator runtime
        run: xcrun simctl list runtimes | grep -q 'iOS-27-0' || xcodebuild -downloadPlatform iOS
      - name: Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('Package.resolved', 'openlist.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: iOS build, unit and UI tests
        run: ./Tools/run-ios-checks.sh
        env:
          OPENLIST_IOS_PART: ${{ matrix.part }}/3
      # The logs apart from the result bundle, which a job stopped mid-test
      # leaves half written and unreadable to the upload.
      - name: iOS logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-logs-${{ matrix.part }}
          path: |
            build/ios/boot.log
            build/ios/build.log
            build/ios/test.log
      - name: iOS test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-results-${{ matrix.part }}
          path: build/ios/Tests.xcresult
