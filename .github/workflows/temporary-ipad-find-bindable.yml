name: Temporary iPad Find bindable path check
on:
  push:
    branches: [codex/temporary-ipad-find-bindable]
permissions:
  contents: read
jobs:
  ipad:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest
      - name: Build and run iPad shell tests
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl create 'Openlist iPad Find bindable' com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M5-12GB com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$UDID" >/dev/null 2>&1 || true' EXIT
          xcodebuild -project openlist.xcodeproj -scheme OpenlistiOS -configuration Debug -destination "id=$UDID" -derivedDataPath build/bindable-check CODE_SIGNING_ALLOWED=NO ICLOUD_CONTAINER_ENVIRONMENT= build-for-testing > bindable-build.log 2>&1 || { tail -120 bindable-build.log; exit 1; }
          xcrun simctl bootstatus "$UDID" -b
          XCTESTRUN=$(ls -t build/bindable-check/Build/Products/*.xctestrun | head -1)
          set +e
          xcodebuild -xctestrun "$XCTESTRUN" -destination "id=$UDID" -parallel-testing-enabled NO -collect-test-diagnostics never -only-testing:OpenlistiOSUITests/IPadShellUITests -resultBundlePath build/BindableCheck.xcresult test-without-building > bindable-test.log 2>&1
          STATUS=$?
          tail -160 bindable-test.log
          exit "$STATUS"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ipad-find-bindable-logs
          path: |
            bindable-build.log
            bindable-test.log
            build/BindableCheck.xcresult
