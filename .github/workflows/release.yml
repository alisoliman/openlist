name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and source
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a vX.Y.Z release tag" >&2
            exit 1
          }
          git merge-base --is-ancestor HEAD origin/main
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Regression checks
        run: ./Tools/check.sh
      - name: Build Apple Silicon app and widget
        run: ./Tools/build-release.sh "$VERSION" "$GITHUB_RUN_NUMBER"
      - name: Import release credentials
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          APP_PROFILE: ${{ secrets.MACOS_APP_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE:?Missing MACOS_CERTIFICATE_P12_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD}"
          : "${NOTARY_KEY:?Missing NOTARY_API_KEY_BASE64}"
          : "${APP_PROFILE:?Missing MACOS_APP_PROVISION_PROFILE_BASE64}"
          umask 077
          KEYCHAIN="$RUNNER_TEMP/openlist-signing.keychain-db"
          PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          printf '%s' "$APP_PROFILE" | base64 --decode > "$RUNNER_TEMP/openlist.provisionprofile"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
      - name: Sign, notarize and package
        env:
          SIGNING_IDENTITY: 'Developer ID Application: Ali Soliman (Y5UE64R7TQ)'
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          APP_PROVISION_PROFILE: ${{ runner.temp }}/openlist.provisionprofile
        run: ./Tools/package-release.sh "$VERSION" "$GITHUB_RUN_NUMBER"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "Openlist $VERSION" --generate-notes \
            dist/*.zip dist/*.dmg dist/SHA256SUMS.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Build and notarization logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-logs
          path: |
            build/release/build.log
            build/release/*notarization.json
      - name: Remove release credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/openlist-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/openlist.provisionprofile"
